<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#d955d0;overflow:hidden}
  #bg{
    position:fixed;inset:0;z-index:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:50% 12%; /* bias the crop upward: keep her face in frame on wide screens */
  }
  /* the chrome emblem layer (z-index:1) is injected by mephy-background.js */
</style>
</head>
<body>
  <video id="bg" src="/bg.mp4" autoplay muted loop playsinline aria-hidden="true"></video>
  <script>
    // some browsers ignore the autoplay attribute — kick playback explicitly
    (function(){
      var v = document.getElementById('bg');
      var kick = function(){ v.play().catch(function(){}); };
      kick();
      v.addEventListener('loadeddata', kick);
      ['pointerdown','touchstart','keydown'].forEach(function(e){
        addEventListener(e, kick, { once: true, passive: true });
      });
      document.addEventListener('visibilitychange', function(){
        if (!document.hidden) kick();
      });
    })();
  </script>

  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
              "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
  </script>
  <script>window.MEPHY_BG_MANUAL = true;</script>
  <script type="module">
    import { initMephyBackground } from '/mephy-background.js';
    initMephyBackground({ transparent: true, zIndex: 1, margin: 1.45 });
  </script>
</body>
