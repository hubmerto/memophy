<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEMPHY.TV — Story</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;}
  /* 9:16 story stage; the app runs at mobile width (420) and is scaled up to fill */
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  #stage{width:420px;height:747px;position:relative;transform-origin:center center;}
  #stage iframe{width:420px;height:747px;border:0;display:block;background:#fff;}
</style>
</head>
<body>
  <div id="wrap"><div id="stage">
    <iframe id="app" src="index.html?nogate&nopop&only=reveal" allow="autoplay"></iframe>
  </div></div>
  <script>
    // scale the 420x747 (9:16) mobile stage to fill the window, keeping 9:16
    function fit(){
      var s=document.getElementById('stage');
      var k=Math.min(window.innerWidth/420, window.innerHeight/747);
      s.style.transform='scale('+k+')';
    }
    addEventListener('resize',fit); fit();
    // first tap on the story forwards into the iframe: start both cams + music (same-origin)
    function kickApp(){
      try{
        var w=document.getElementById('app').contentWindow, d=w.document;
        var v=d.getElementById('vid'), g=d.getElementById('gvid');
        if(v){ v.muted=true; v.play().catch(function(){}); }
        if(g){ g.muted=true; g.play().catch(function(){}); }
        var a=d.getElementById('song');
        if(typeof w.toggleSong==='function' && a && a.paused) w.toggleSong();
      }catch(e){}
    }
    addEventListener('pointerdown',kickApp,{once:true});
    addEventListener('click',kickApp,{once:true});
  </script>
</body>
</html>
